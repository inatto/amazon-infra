<VirtualHost 127.0.0.1:443 _default_:443>
  ServerName inatto.com
  ServerAlias www.inatto.com
  SSLEngine on
  SSLCertificateFile "/opt/bitnami/apache/conf/inatto.com.crt"
  SSLCertificateKeyFile "/opt/bitnami/apache/conf/inatto.com.key"
  DocumentRoot /home/sindicatto/sites/inatto/dist
  # BEGIN: Configuration for letsencrypt
  Include "/opt/bitnami/apps/letsencrypt/conf/httpd-prefix.conf"
  # END: Configuration for letsencrypt
  # BEGIN: Support domain renewal when using mod_proxy without Location
  <IfModule mod_proxy.c>
    ProxyPass /.well-known !
  </IfModule>
  # END: Support domain renewal when using mod_proxy without Location
  <Directory "/home/sindicatto/sites/inatto/dist">
    Options -Indexes +FollowSymLinks -MultiViews
    AllowOverride All
    Require all granted
  </Directory>
  # BEGIN: Support domain renewal when using mod_proxy within Location
  <Location /.well-known>
    <IfModule mod_proxy.c>
      ProxyPass !
    </IfModule>
  </Location>
  # END: Support domain renewal when using mod_proxy within Location
</VirtualHost>
