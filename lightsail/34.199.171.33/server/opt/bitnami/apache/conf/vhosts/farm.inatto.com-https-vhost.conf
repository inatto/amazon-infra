<VirtualHost 127.0.0.1:443 _default_:443>
  ServerName farm.inatto.com

  SSLEngine on
  SSLCertificateFile "/opt/bitnami/apache/conf/farm.inatto.com.crt"
  SSLCertificateKeyFile "/opt/bitnami/apache/conf/farm.inatto.com.key"

  DocumentRoot /home/intcom/farm.inatto.com

  <Directory "/home/intcom/farm.inatto.com">
    Options -Indexes +FollowSymLinks -MultiViews
    AllowOverride All
    Require all granted
  </Directory>
</VirtualHost>
